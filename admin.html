<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Grace Luxe · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#161513;--card:#1c1a18;--raised:#262421;--ink:#efe9de;--ink2:#aaa398;--mute:#8a847a;--line:rgba(239,233,222,.12);--gold:#c9a24a;--on-gold:#14110a;--serif:"Instrument Serif",Georgia,serif;--sans:"Instrument Sans",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding-bottom:40px}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}.nav{max-width:1100px;margin:auto;height:62px;padding:0 18px;display:flex;align-items:center;gap:12px}.logo{font:26px var(--serif);margin-right:auto;text-decoration:none}.wrap{max-width:1100px;margin:28px auto;padding:0 16px}.title{font:36px/1.1 var(--serif);margin:12px 0 20px}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}.btn{border:0;border-radius:9px;padding:12px 16px;background:var(--gold);color:#14110a;font-weight:600;min-height:44px}.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn.danger{background:#8d3434;color:white}.btn:disabled{opacity:.5;cursor:not-allowed}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{padding:10px 15px;border:1px solid var(--line);border-radius:9px;background:transparent}.tab.active{border-color:var(--gold);color:var(--gold)}.badge{display:inline-flex;min-width:22px;justify-content:center;border-radius:99px;background:var(--gold);color:#14110a;padding:0 6px;font-size:12px;font-weight:bold}.muted{color:var(--ink2)}.msg{padding:12px;border-radius:9px;border:1px solid var(--line);margin:12px 0;color:var(--ink2)}.msg.error{color:#ff9999}.msg.ok{color:#b9dfa8}.field{display:flex;flex-direction:column;gap:5px;margin:12px 0}.field label{font-size:13px;color:var(--mute)}input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px}textarea{min-height:90px;resize:vertical}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.product{display:grid;grid-template-columns:84px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.thumb{width:84px;height:100px;object-fit:cover;border-radius:8px;background:var(--raised)}.product h3{font:24px/1.1 var(--serif);margin:0 0 6px}.small{font-size:13px;color:var(--ink2)}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions .btn{padding:8px 12px;min-height:38px}.stock-controls{display:flex;align-items:center;gap:8px;margin-top:8px}.stock-controls button{width:38px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--raised)}.stock-controls strong{min-width:30px;text-align:center}.media-list{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.media-item{position:relative;background:var(--raised);border-radius:9px;overflow:hidden}.media-item img,.media-item video{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}.media-item .actions{padding:6px}.media-item button{font-size:12px;padding:7px}.order{border-bottom:1px solid var(--line);padding:16px 0}.order h3{font:25px var(--serif);margin:0}.order-lines{white-space:pre-line;color:var(--ink2);font-size:14px;margin:10px 0}.status{display:inline-block;padding:4px 8px;border-radius:6px;background:var(--raised);font-size:12px}.hidden{display:none!important}.login{max-width:420px;margin:8vh auto}.empty{text-align:center;padding:30px;color:var(--ink2)}.inline-check{display:flex;align-items:center;gap:10px;margin:12px 0}.inline-check input{width:auto}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.filters button{white-space:nowrap}.price{font-variant-numeric:tabular-nums;color:var(--gold)}@media(min-width:700px){.product{grid-template-columns:100px 1fr}.thumb{width:100px;height:120px}.panel{padding:22px}.media-list{grid-template-columns:repeat(5,1fr)}}
</style></head><body>
<header><div class="nav"><a class="logo" href="index.html">Grace Luxe</a><span class="muted">Store manager</span><button class="btn secondary hidden" id="logout">Log out</button></div></header>
<main class="wrap">
<section id="loginPanel" class="panel login"><h1 class="title">Welcome, Grace</h1><p class="muted">Sign in to manage your shop.</p><form id="loginForm"><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div><div id="loginMsg" class="msg hidden" role="alert"></div><button class="btn" style="width:100%">Sign in</button></form></section>
<section id="app" class="hidden"><h1 class="title">Your shop</h1><div id="globalMsg" class="msg hidden" role="status"></div><div class="tabs"><button class="tab active" data-tab="products">Products</button><button class="tab" data-tab="orders">Orders <span id="pendingBadge" class="badge">0</span></button></div>
<section id="productsTab" class="panel"><div class="row"><div><h2 class="title" style="font-size:30px">Products</h2><p class="muted">Add new styles or update your collection.</p></div><button class="btn" id="addProduct">+ Add product</button></div><div id="productList"><p class="empty">Loading products…</p></div></section>
<section id="ordersTab" class="panel hidden"><h2 class="title" style="font-size:30px">Orders</h2><div class="filters" id="filters"></div><div id="orderList"><p class="empty">Loading orders…</p></div></section>
</section>
</main>
<div id="editor" class="hidden" style="position:fixed;inset:0;background:#000b;z-index:20;overflow:auto;padding:16px"><section class="panel" style="max-width:680px;margin:20px auto"><div class="row"><h2 class="title" id="editorTitle">Add product</h2><button class="btn secondary" id="closeEditor" style="flex:0 0 auto">Close</button></div>
<form id="productForm"><input type="hidden" id="pid"><div class="field"><label for="pname">Product name</label><input id="pname" required maxlength="140"></div><div class="field"><label for="pcat">Category</label><select id="pcat"><option>Dresses</option><option>Sets</option><option>Bags and slippers</option></select></div><div class="field"><label for="pdesc">Description</label><textarea id="pdesc" maxlength="1200"></textarea></div><div class="row"><div class="field"><label for="pprice">Price (₦)</label><input id="pprice" type="number" min="0" step="1" required></div><div class="field"><label for="pstock">Stock</label><input id="pstock" type="number" min="0" step="1" required></div><div class="field"><label for="pmoq">Minimum order (MOQ)</label><input id="pmoq" type="number" min="1" step="1" value="1" required></div></div><div class="field"><label for="psizes">Sizes (comma separated)</label><input id="psizes" placeholder="S, M, L, XL"></div><label class="inline-check"><input id="pactive" type="checkbox" checked> Visible in the shop</label><label class="inline-check"><input id="pfeatured" type="checkbox"> Feature in hero carousel</label>
<div class="field"><label for="files">Photos and videos</label><input id="files" type="file" accept="image/*,video/*" multiple><span class="small">Photos are reduced before upload. Videos must be 50 MB or smaller.</span></div><div id="uploadMsg" class="msg hidden"></div><div id="mediaList" class="media-list"></div><div class="row" style="margin-top:20px"><button class="btn" id="saveProduct">Save product</button><button class="btn secondary" type="button" id="cancelEdit">Cancel</button></div><div id="editorMsg" class="msg hidden" role="alert"></div></form></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
/* GRACE LUXE CONFIG — use the same project URL and anon public key as index.html */
const SUPABASE_URL="https://eceksawesmuzpdwsonwx.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_kwAPbdCLCih2dvjZG4VREg_1AomFlD6";
/* END CONFIG */
const ready=SUPABASE_URL.startsWith("https://")&&!SUPABASE_URL.includes("PASTE_")&&SUPABASE_ANON_KEY&&!SUPABASE_ANON_KEY.includes("PASTE_");
const db=ready?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const $=s=>document.querySelector(s),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"₦"+Number(n||0).toLocaleString("en-NG"),stamp=s=>new Date(s).toLocaleString("en-NG",{dateStyle:"medium",timeStyle:"short"});
let products=[],orders=[],currentMedia=[],filter="all",refreshTimer=null;
function message(el,text,type=""){el.textContent=text;el.className="msg"+(type?" "+type:"");el.classList.remove("hidden")}
function clearMessage(el){el.classList.add("hidden");el.textContent=""}
function showApp(user){$("#loginPanel").classList.toggle("hidden",!!user);$("#app").classList.toggle("hidden",!user);$("#logout").classList.toggle("hidden",!user);if(user){loadProducts();loadOrders();clearInterval(refreshTimer);refreshTimer=setInterval(loadOrders,20000)}else clearInterval(refreshTimer)}
async function sessionCheck(){if(!db){message($("#loginMsg"),"Add your Supabase project URL and anon public key in admin.html, then reload.","error");return}let {data}=await db.auth.getSession();showApp(data.session?.user||null);db.auth.onAuthStateChange((_event,session)=>showApp(session?.user||null))}
$("#loginForm").onsubmit=async e=>{e.preventDefault();if(!db)return;let btn=e.submitter;btn.disabled=true;btn.textContent="Signing in…";let {data,error}=await db.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#password").value});btn.disabled=false;btn.textContent="Sign in";if(error){message($("#loginMsg"),"That email and password did not work. Please check them and try again.","error");return}clearMessage($("#loginMsg"));showApp(data.user)};
$("#logout").onclick=async()=>{await db.auth.signOut();showApp(null)};
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));$("#productsTab").classList.toggle("hidden",b.dataset.tab!=="products");$("#ordersTab").classList.toggle("hidden",b.dataset.tab!=="orders")});
async function loadProducts(){let {data,error}=await db.from("products").select("*").order("created_at",{ascending:false});if(error){message($("#globalMsg"),"Could not load products: "+error.message,"error");return}products=data||[];renderProducts()}
function mainPhoto(p){let m=Array.isArray(p.media)?p.media[0]:null;return m?.url?`<img class="thumb" src="${esc(m.url)}" alt="${esc(p.name)}" loading="lazy">`:'<div class="thumb"></div>'}
function renderProducts(){$("#productList").innerHTML=products.length?products.map(p=>`<article class="product">${mainPhoto(p)}<div><h3>${esc(p.name)}</h3><div class="price">${money(p.price)}</div><div class="small">${esc(p.category)} · MOQ ${p.moq} · ${p.active?"Visible":"Hidden"}</div><div class="stock-controls"><span class="small">Stock</span><button data-stock="-1" data-id="${esc(p.id)}" aria-label="Reduce stock">−</button><strong>${p.stock}</strong><button data-stock="1" data-id="${esc(p.id)}" aria-label="Increase stock">+</button></div><div class="actions"><button class="btn" data-edit="${esc(p.id)}">Edit</button><button class="btn secondary" data-delete="${esc(p.id)}">Delete</button></div></div></article>`).join(""):'<p class="empty">No products yet. Tap Add product to create the first one.</p>'}
$("#productList").onclick=async e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.edit)editProduct(b.dataset.edit);if(b.dataset.stock){let p=products.find(x=>x.id===b.dataset.id),stock=Math.max(0,+p.stock+(+b.dataset.stock));let {error}=await db.from("products").update({stock}).eq("id",p.id);if(error)message($("#globalMsg"),"Stock was not changed: "+error.message,"error");else loadProducts()}if(b.dataset.delete){let p=products.find(x=>x.id===b.dataset.delete);if(!confirm(`Delete ${p.name}? This cannot be undone.`))return;let {error}=await db.from("products").delete().eq("id",p.id);if(error)message($("#globalMsg"),"Could not delete this product: "+error.message,"error");else{message($("#globalMsg"),"Product deleted.","ok");loadProducts()}}};
function openEditor(p=null){$("#productForm").reset();clearMessage($("#editorMsg"));clearMessage($("#uploadMsg"));$("#pid").value=p?.id||"";$("#editorTitle").textContent=p?"Edit product":"Add product";$("#pname").value=p?.name||"";$("#pcat").value=p?.category||"Dresses";$("#pdesc").value=p?.description||"";$("#pprice").value=p?.price??"";$("#pstock").value=p?.stock??0;$("#pmoq").value=p?.moq??1;$("#psizes").value=(p?.sizes||["S","M","L","XL"]).join(", ");$("#pactive").checked=p?.active??true;$("#pfeatured").checked=p?.featured??false;currentMedia=Array.isArray(p?.media)?p.media.map(x=>({...x})):[];renderMedia();$("#files").value="";$("#editor").classList.remove("hidden")}
function editProduct(id){openEditor(products.find(p=>p.id===id))}
$("#addProduct").onclick=()=>openEditor();$("#closeEditor").onclick=$("#cancelEdit").onclick=()=>$("#editor").classList.add("hidden");
function renderMedia(){$("#mediaList").innerHTML=currentMedia.map((m,i)=>`<div class="media-item">${m.type==="video"?`<video src="${esc(m.url)}" controls muted playsinline></video>`:`<img src="${esc(m.url)}" alt="Product media ${i+1}">`}<div class="actions"><button class="btn secondary" data-move="-1" data-i="${i}" ${i===0?"disabled":""}>←</button><button class="btn secondary" data-move="1" data-i="${i}" ${i===currentMedia.length-1?"disabled":""}>→</button><button class="btn danger" data-remove="${i}">Remove</button></div></div>`).join("")}
$("#mediaList").onclick=e=>{let b=e.target.closest("button");if(!b)return;let i=+b.dataset.i;if(b.dataset.remove!==undefined)currentMedia.splice(+b.dataset.remove,1);else if(b.dataset.move){let j=i+(+b.dataset.move);if(j>=0&&j<currentMedia.length)[currentMedia[i],currentMedia[j]]=[currentMedia[j],currentMedia[i]]}renderMedia()};
function shrinkImage(file){return new Promise((resolve,reject)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let scale=Math.min(1,1400/img.width),canvas=document.createElement("canvas");canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);let ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>{URL.revokeObjectURL(url);if(blob)resolve(new File([blob],file.name.replace(/\.[^.]+$/,"")+".jpg",{type:"image/jpeg"}));else reject(new Error("Could not prepare this photo."))},"image/jpeg",.8)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("Could not open one of the selected photos."))};img.src=url})}
$("#files").onchange=async e=>{let files=[...e.target.files];if(!files.length)return;let btn=$("#saveProduct");btn.disabled=true;message($("#uploadMsg"),"Preparing and uploading your files…");try{for(let file of files){let isVideo=file.type.startsWith("video/");if(isVideo&&file.size>50*1024*1024)throw new Error(`${file.name} is larger than 50 MB. Choose a smaller video.`);if(!isVideo&&!file.type.startsWith("image/"))throw new Error(`${file.name} is not a supported photo or video.`);let upload=isVideo?file:await shrinkImage(file);let safeName=upload.name.toLowerCase().replace(/[^a-z0-9._-]/g,"-");let path=`products/${Date.now()}-${crypto.randomUUID()}-${safeName}`;let {error}=await db.storage.from("media").upload(path,upload,{contentType:upload.type,upsert:false});if(error)throw error;let {data}=db.storage.from("media").getPublicUrl(path);currentMedia.push({url:data.publicUrl,type:isVideo?"video":"image"})}renderMedia();message($("#uploadMsg"),"Files uploaded. Save the product to keep these changes.","ok")}catch(err){message($("#uploadMsg"),err.message||"Upload failed. Please try again.","error")}finally{btn.disabled=false;e.target.value=""}};
$("#productForm").onsubmit=async e=>{e.preventDefault();let name=$("#pname").value.trim(),price=Number($("#pprice").value),stock=Number($("#pstock").value),moq=Number($("#pmoq").value);if(!name||!Number.isInteger(price)||price<0||!Number.isInteger(stock)||stock<0||!Number.isInteger(moq)||moq<1){message($("#editorMsg"),"Please check the name, price, stock and minimum order fields.","error");return}let payload={name,category:$("#pcat").value,description:$("#pdesc").value.trim(),price,stock,moq,sizes:$("#psizes").value.split(",").map(x=>x.trim()).filter(Boolean),active:$("#pactive").checked,featured:$("#pfeatured").checked,media:currentMedia};let id=$("#pid").value,btn=$("#saveProduct");btn.disabled=true;btn.textContent="Saving…";let result=id?await db.from("products").update(payload).eq("id",id):await db.from("products").insert(payload);btn.disabled=false;btn.textContent="Save product";if(result.error){message($("#editorMsg"),"Could not save this product: "+result.error.message,"error");return}$("#editor").classList.add("hidden");message($("#globalMsg"),id?"Product updated.":"Product added.","ok");loadProducts()};
const statuses=[["all","All"],["awaiting_payment","Awaiting payment"],["paid_claimed","Paid claimed"],["paid","Paid"],["cancelled","Cancelled"]];
function renderFilters(){$("#filters").innerHTML=statuses.map(([v,t])=>`<button class="tab ${filter===v?"active":""}" data-filter="${v}">${t}</button>`).join("")}
$("#filters").onclick=e=>{let b=e.target.closest("[data-filter]");if(!b)return;filter=b.dataset.filter;renderOrders()};
async function loadOrders(){if(!db)return;let {data,error}=await db.from("orders").select("*").order("created_at",{ascending:false});if(error){message($("#globalMsg"),"Could not refresh orders: "+error.message,"error");return}orders=data||[];$("#pendingBadge").textContent=orders.filter(o=>o.status==="paid_claimed").length;renderOrders()}
function renderOrders(){renderFilters();let list=orders.filter(o=>filter==="all"||o.status===filter);$("#orderList").innerHTML=list.length?list.map(o=>{let items=Array.isArray(o.items)?o.items:[];let lines=items.map(i=>`${i.qty} × ${i.name} · Size ${i.size}`).join("\n");return `<article class="order"><div class="row"><div><h3>${esc(o.code)}</h3><div class="small">${esc(stamp(o.created_at))}</div></div><span class="status">${esc(o.status.replaceAll("_"," "))}</span></div><p><b>${esc(o.customer_name)}</b></p><p><a href="tel:${esc(String(o.phone).replace(/[^\d+]/g,""))}">${esc(o.phone)}</a></p><p class="small">${esc(o.state||"")} · ${esc(o.address)}</p><div class="order-lines">${esc(lines)}</div><p class="price"><b>${money(o.total)}</b></p>${o.note?`<p class="small">Note: ${esc(o.note)}</p>`:""}<div class="actions">${o.status==="paid_claimed"||o.status==="awaiting_payment"?`<button class="btn" data-confirm="${esc(o.id)}">Confirm payment</button>`:""}${o.status!=="cancelled"&&o.status!=="paid"?`<button class="btn danger" data-cancel="${esc(o.id)}">Cancel order</button>`:""}</div></article>`}).join(""):'<p class="empty">No orders in this filter.</p>'}
$("#orderList").onclick=async e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.confirm){if(!confirm("Have you checked your bank app and confirmed this payment arrived?"))return;let {error}=await db.from("orders").update({status:"paid"}).eq("id",b.dataset.confirm);if(error)message($("#globalMsg"),"Could not confirm payment: "+error.message,"error");else{message($("#globalMsg"),"Payment confirmed. The order is now marked Paid.","ok");loadOrders()}}if(b.dataset.cancel){if(!confirm("Are you sure you want to cancel this order? The reserved stock will be returned."))return;let {error}=await db.rpc("cancel_order",{p_id:b.dataset.cancel});if(error)message($("#globalMsg"),"Could not cancel this order: "+error.message,"error");else{message($("#globalMsg"),"Order cancelled and stock returned.","ok");loadOrders();loadProducts()}}};
sessionCheck();
</script></body></html>
